[project]
name = "genai-engineering"
version = "0.1.0"
description = "Structured extraction, document RAG, safe tool agents, and a Streamlit chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5,<0.6",
    "ddgs>=9.0",
    "google-genai>=1.0",
    "langchain-text-splitters>=0.3",
    "openai>=1.50",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: may use live provider credentials and incur API charges"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]
